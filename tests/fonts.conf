<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Test fixtures only need one predictable substitute for Helvetica.
       Avoid scanning every font installed on a developer/CI machine. -->
  <dir>/usr/share/fonts/truetype/dejavu</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <alias><family>Helvetica</family><prefer><family>DejaVu Sans</family></prefer></alias>
</fontconfig>
