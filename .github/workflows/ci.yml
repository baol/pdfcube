name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential meson ninja-build python3 dbus-daemon xvfb xauth mesa-utils \
            python3-pil texlive-latex-recommended texlive-pictures \
            libgl1-mesa-dri libegl-dev fonts-dejavu-core \
            libgtk-4-dev libepoxy-dev libpoppler-glib-dev libcairo2-dev \
            libboost-program-options-dev appstream desktop-file-utils \
            debhelper lintian
      - name: Configure
        run: meson setup build -Db_sanitize=address,undefined
      - name: Build
        run: meson compile -C build
      - name: Test
        run: meson test -C build --print-errorlogs
      - name: Report test timing SLO
        if: always() && hashFiles('build/meson-logs/testlog.json') != ''
        run: python3 tools/check_test_slo.py build/meson-logs/testlog.json
      - name: Build documentation
        run: meson compile -C build doc
      - uses: actions/upload-artifact@v4
        with:
          name: beamer-showcase
          path: build/examples/showcase/showcase.pdf
          if-no-files-found: error
      - name: GUI snapshot smoke test
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
        run: python3 tools/gui_smoke.py build/src/pdfcube examples/transitions/blinds-horizontal.pdf --cache build/tests/native-test-cache
      - name: Validate desktop metadata
        run: |
          desktop-file-validate org.pdfcube.pdfcube.desktop
          appstreamcli validate --pedantic --no-net build/org.pdfcube.pdfcube.metainfo.xml
      - name: Build source archive
        run: meson dist -C build --formats gztar
      - name: Build Debian package
        run: |
          sed -i '1s/ unstable;/ noble;/' debian/changelog
          dpkg-buildpackage -us -uc -b
          dpkg-deb --extract ../pdfcube_*_amd64.deb build/deb-doc-check
          for name in showcase.pdf showcase.tex README.md; do
            test -s "build/deb-doc-check/usr/share/doc/pdfcube/examples/${name}"
          done
      - name: Lint Debian package
        run: lintian --profile ubuntu ../pdfcube_*.changes

  macos:
    runs-on: macos-15
    env:
      PDFCUBE_VERSION: '0.0.0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: brew install meson ninja pkg-config gtk4 libepoxy poppler boost dylibbundler librsvg
      - name: Configure
        run: meson setup build -Dwerror=true
      - name: Build
        run: meson compile -C build
      - name: Test command-line interface
        run: meson test -C build "command-line compatibility" --print-errorlogs
      - name: Build and verify DMG
        run: packaging/macos/build-dmg.sh build/src/pdfcube 0.0.0 pdfcube-ci-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: pdfcube-ci-macos.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    env:
      PDFCUBE_VERSION: '0.0.0'
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libepoxy
            mingw-w64-ucrt-x86_64-poppler
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-imagemagick
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-msitools
      - name: Configure
        run: meson setup build -Dwerror=true
      - name: Build
        run: meson compile -C build
      - name: Test command-line interface
        run: meson test -C build "command-line compatibility" --print-errorlogs
      - name: Build and verify MSI
        run: packaging/windows/build-msi.sh build/src/pdfcube.exe 0.0.0 pdfcube-ci-x86_64.msi
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: pdfcube-ci-x86_64.msi
          if-no-files-found: error

