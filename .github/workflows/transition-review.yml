name: Transition review gallery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gallery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential meson ninja-build pkg-config python3 python3-pil \
            xvfb xauth ffmpeg libgl1-mesa-dri libegl-dev fonts-dejavu-core \
            libgtk-4-dev libepoxy-dev libpoppler-glib-dev libcairo2-dev \
            libboost-program-options-dev dbus-daemon
      - name: Build application
        run: |
          meson setup build --buildtype=release
          meson compile -C build src/pdfcube
      - name: Capture transition review gallery
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          LP_NUM_THREADS: '1'
        run: python3 tools/transition_gallery.py build/src/pdfcube build/transition-gallery
      - uses: actions/upload-artifact@v4
        with:
          name: transition-review-${{ github.sha }}
          path: build/transition-gallery/
          if-no-files-found: error
